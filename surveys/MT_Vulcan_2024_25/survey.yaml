name: MT_Vulcan_2024_25
instrument: lemi423
sample_rate: 1000
data_root: E:/MT_Timeseries_DATA/MT_Vulcan/Data_2024-25
workspace: D:/MT_DATA/MT_Vulcan_2024_25_Workspace
# set explicitly: the default <data_root>/work would write onto E:, which stays read-only
# local time of the field area (IANA name), for display only: every
# timestamp in the YAML, the archives and the scripts is UTC
timezone: Australia/Adelaide
# written by this script from the raw files' headers: re-running it (--force)
# overwrites every edit made since, the GUI's Metadata tab included
generated_by: scripts/new_survey.py
defaults:
  dipole_length_ex: 50.0
  dipole_length_ey: 50.0
  azimuth_ex: 0.0
  azimuth_ey: 90.0
  # the north the sensors were laid out to: magnetic at every site on the field sheet, as in 2022
  # (Liu et al. 2024, p. 4: x = magnetic north); products stay in this frame with each site's IGRF
  # declination
  layout_north: magnetic
  # LEMI-120 coil response (LEMI-423 sites, and EDL sites with sensor_type lemi120);
  # a relative path resolves against this folder first
  calibration_fn: sensors/l120n.rsp
  # LEMI-423 sites: magnetics correction to the lemimt convention, pT to nT and polarity
  h_scale: -1000.0
  # true: a 180/270 deg azimuth means the pair was wired reversed and its data are sign-flipped
  # at ingest; every dipole is declared 0/90 except Vul25_RR1's Ex (azimuth_ex 180)
  flip_reversed_dipoles: true
  # the columns that had a sensor attached; ingest drops the rest, e.g. the B423 Bz column,
  # an open input with no hz coil
  channels: [ex, ey, hx, hy]
# lemimt-style even log-period band layout (see mt_workbench.bands.build_band_scheme)
processing:
  min_period: 0.005
  max_period: 5000.0
  periods_per_decade: 10.0
  # keep bands clear of mains and its first in-range harmonic
  notch_frequencies: [50.0, 150.0]
  # the two lowest bands of every decimation level (harmonics 7-10) are labelled
  # 4-5 % below their harmonics and read 3-6 % high in rho: start at harmonic 10
  min_bin: 10
# site entries: two campaigns in one folder, the 12 Vul24_* sites (Nov 2024) and the 12 Vul25_*
# sites (Mar 2025); site names are the folder names. Vul24_RR1/Vul25_RR1 and Vul24_RR2/Vul25_RR2
# are one spot each (1.3 m and 2.9 m apart) and stay separate sites. start/end are the file-name
# epochs (UTC), first to last plus 5400 s, so end runs up to 1.5 h past the last record
# Comments inside the sites block are lost when the GUI's Metadata tab saves the file.
