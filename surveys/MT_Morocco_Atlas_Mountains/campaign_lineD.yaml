# Campaign plan for scripts/campaign.py: line D of the Morocco Atlas survey,
# drafted 27 Sep 2026 from the line D noise profile and the ten deep dives
# (notes/lineD/, HANDOVER.md "Line D"). It runs once Ben has declared the
# chains, masks and the D12 flip the dives proposed (notes/decisions.md,
# "Line D declarations"), after the line A campaign.
#
#   python scripts/campaign.py surveys/MT_Morocco_Atlas_Mountains/survey.yaml \
#       surveys/MT_Morocco_Atlas_Mountains/campaign_lineD.yaml --dry-run
#
# Outputs go to <workspace>/campaign/lineD/. Ben's lemimt reference EDIs
# (E:\Ben_Documents\EDIs\Morocco_ATLAS\Line_D) give the _vs_lemimt overlays;
# lemimt is not ground truth at D10 (dipole), D05 (63 Hz file) or D08's 1000 Hz
# xy (its own mains-line contamination), and it has no D15 and only 5 D02 files.
name: lineD
description: >
  Line D: every site rr every concurrent site with aurora (Hann, the
  declared chains), then on each site's best remote the masked, unfiltered
  and MANTLE products. Group 1 (D01-D03, D05, D06, D11-D16, 19-21 Sep 2023,
  every pair overlapping 37-46 h) and group 2 (D07-D10, 21-22 Sep, only
  each other). Decisions from the 27 Sep dives: D14 is the group 1 remote
  of choice (D01, D11, D12, D13 on it; D03 on D02), D07 the group 2 remote
  for D08-D10 and D09 for D07; D06's remote is left to the score (rr D14
  failed at 2.9 s once the storm was cut). The night E family at D01, D03,
  D09, D11, D13 wants night masks for xy with yx from the unmasked run (a
  per-mode merge the runner lacks: merge_modes.py by hand); the traffic
  coil bursts at D06, D08, D10, D12, D13 and D07's pickup are masks, some
  of scope both. D12's ey is reversed (flip after the notch). D10's ey
  records 0.534 x ex plus a weak E-W part: both modes ship as recorded
  with that note. D15 had no dive (campaign only). No stacks.

sites: [D01, D02, D03, D05, D06, D07, D08, D09, D10, D11, D12, D13, D14, D15, D16]

groups:
  G1: [D01, D02, D03, D05, D06, D11, D12, D13, D14, D15, D16]   # 19-21 Sep 2023, all concurrent
  G2: [D07, D08, D09, D10]                                      # 21-22 Sep, 20-21 h each

overlap:
  min_fraction: 0.5
  min_hours: 12

# per-site decisions from the dives (notes/lineD/<site>.md), sceptic-supported
remotes:
  D01: D14          # D13's coils are dead at 3-13 s (the 23 Sep sawtooth was the remote)
  D02: D14          # the D02 dive and trials, 28 Sep: D03 pulls yx at 1-10 s 0.2 dex low; D13 within 0.003 dex
  D03: D02          # the better remote once the nights and the storm are masked
  D05: D14          # the D05 dive and sceptic, 27 Sep: D14 over the whole record (the score's pick is D16)
  D07: D09          # coils 0.95-0.99 coherent; D08's are incoherent at 1-30 s
  D08: D07          # smoother at 12-1000 s xy and 3-30 s yx with the masks
  D09: D07          # D07 with its pickup masked (scope both)
  D10: D07          # right at 10-30 s; costs 50 min of overlap against D09
  D11: D14
  D12: D14          # D13's own coils are noisy at 3-10 s
  D13: D14

stages:
  variants: {}
  remotes: {}                      # stage 1: aurora defaults (Hann), tag lineD-default
  stacks:                          # stage 2: not run (launch with --stage 0,1,3)
    weightings: {u: none, w: coherence}
  options:                         # stage 3 on the best stage 1 remote (or the override)
    tie_tolerance: 0.02
    configs:
      masked: [--masks]                                    # masks.yaml (nights, traffic bursts, storm, pickup)
      nofilters: [--no-filters]                            # the raw archives: what the declared chains change
      mantle: [--engine, mantle, --mantle-max-hours, "48"]   # the runner adds --no-masks

scoring:
  pmin: 0.005
  pmax: 5000

runner:
  minutes_per_job: {rr: 8, variant: 3, stack: 1, mantle: 12}
  min_available_gb: 25
  peak_factor: 1.0
  expected_peak_gb: {rr: 35, variant: 25, stack: 8, mantle: 70}   # 40-48 h records; MANTLE 1.35 GB per hour of window
  peak_recent: 30
  move_products: false
  masks: false                     # stage 1 unmasked; the masked config is stage 3
