# Campaign plan for scripts/campaign.py: line A of the Morocco Atlas survey,
# drafted 26 Sep 2026 from the line A noise profile and the ten deep dives
# (notes/lineA/, HANDOVER.md "Line A"). It runs once Ben has declared the
# chains, masks and the A19 flip the dives proposed (notes/decisions.md).
#
#   python scripts/campaign.py surveys/MT_Morocco_Atlas_Mountains/survey.yaml \
#       surveys/MT_Morocco_Atlas_Mountains/campaign_lineA.yaml --dry-run
#
# Outputs go to <workspace>/campaign/lineA/.
name: lineA
description: >
  Line A: every site rr every concurrent site with aurora (Hann, the
  declared chains), then on each site's best remote the masked, unfiltered
  and MANTLE products. Decisions from the 26 Sep dives: A01 on A06 (A02's
  coils carry a 1 Hz pulse comb and A04's are incoherent below 0.1 s), A02
  on A06, A14 on A13 (not A15, whose coils share A14's 20-100 Hz skirt),
  A18 on A16 (A17 ruins 0.006-0.023 s), A19 on A21, A21 on A20, A23 and A26
  on A24, A29 on A28. A05 is a byte copy of A14 and A27 has 4.5 h with
  clipped coils; A25 has no concurrent line A site and is processed by
  hand (A25 rr R02 to 0.3 s, A25L rr EBR for yx at 100-1000 s). R02 and
  R03 are not remotes for line A (their H is incoherent with line A at
  0.1-10 s and source-dominated at 10-100 s). A14's two E channels record
  the same NE component and A19's x row is 0.12 times its y row, so both
  ship as recorded with those notes for the student. No stacks: they made
  no case on line C and their error bars are broken (ZVAR ~1e-20).

sites: [A01, A02, A03, A04, A06, A07, A08, A09, A10, A11, A12, A13, A14, A15,
        A16, A17, A18, A19, A20, A21, A23, A24, A26, A28, A29, A30, A31]

exclude:
  A05: >-
    its raw folder is a byte copy of A14's (logger 12, same position and
    data CRCs); the real A05 (logger 11) is not in the archive
  A25: >-
    no concurrent line A site (21-22 Feb, 17 h); processed by hand against
    R02 (0.005-0.3 s) and Ebro at 1 Hz (yx 100-1000 s)
  A27: >-
    4.5 h of record with hx and hy clipped 65-87 % of the time at the ADC
    rails, and only 4.5 h of overlap with A26

groups:
  Jul: [A01, A02, A06, A04, A07, A08, A09, A03, A10, A11, A12, A13, A14, A15]   # 11-16 Jul 2023, staggered
  Feb_a: [A23, A24, A26]                        # 23-27 Feb
  Feb_b: [A19, A20, A21]                        # 27 Feb - 2 Mar
  Mar_a: [A31, A16, A17, A18]                   # A31 1-5 Mar bridges A16-A18 (2-6 Mar)
  Mar_b: [A30, A28, A29]                        # A30 5-9 Mar bridges A28/A29 (7-10 Mar)

overlap:
  min_fraction: 0.5
  min_hours: 12

# per-site decisions from the dives (notes/lineA/<site>.md)
remotes:
  A01: A06          # E-side noise; A02 and A04 have bad coils; A07 1.1-7x worse
  A02: A06          # its own coils fail at 0.002-4 s; A06 gives the smoothest short periods
  A04: A08          # D07: notch + coil masks tested on A08 (A04 dive, verify-A04); declared 29 Sep
  A07: A08          # D11: notch + coil masks rr A08, both modes (A07 dive, verify-A07); declared 29 Sep
  A08: A07          # D13: notched A08 rr A07, both modes (A08 dive, verify-A08); declared 29 Sep
  A14: A13          # A15's coils share A14's 20-100 Hz skirt; A12 is the alternative
  A18: A16          # A17 ruins both modes at 0.006-0.023 s
  A19: A21          # on phase roughness; A20 is better at 100-1000 s (a per-band choice later)
  A21: A20          # 4.1 km, 67.6 h; A19 smoother at 1.4-6 s only
  A23: A24          # A26 fails below 0.03 s
  A26: A24          # A23 gives xy errors 1.36 at 10-100 s against 0.30
  A29: A28          # A30 worse at 0.005-0.1 s once both are filtered

stages:
  variants: {}
  remotes: {}                      # stage 1: aurora defaults (Hann), tag lineA-default
  stacks:                          # stage 2: not run (launch with --stage 0,1,3)
    weightings: {u: none, w: coherence}
  options:                         # stage 3 on the best stage 1 remote (or the override)
    tie_tolerance: 0.02
    configs:
      masked: [--masks]                                    # masks.yaml (A19 hx settling, A21 fault, A26 episodes, ...)
      nofilters: [--no-filters]                            # the raw archives: what the new chains change
      mantle: [--engine, mantle, --mantle-max-hours, "48"]   # the runner adds --no-masks; 48 h caps MANTLE at ~65 GB on the 90-96 h March records

scoring:
  pmin: 0.005
  pmax: 5000

runner:
  minutes_per_job: {rr: 10, variant: 3, stack: 1, mantle: 15}
  min_available_gb: 25
  peak_factor: 1.0
  expected_peak_gb: {rr: 45, variant: 30, stack: 8, mantle: 70}   # A16-A18 and A30/A31 are 88-96 h records (line B's 5-day July sites peaked at 53 GB)
  peak_recent: 30
  move_products: false
  masks: false                     # stage 1 unmasked; the masked config is stage 3
