# Campaign plan for scripts/campaign.py: line C of the Morocco Atlas survey,
# round 2 (decided with Ben on 2026-09-25 23:45-00:10, after the line C
# diagnoses of that evening; see HANDOVER.md "Line C round 2").
#
#   python scripts/campaign.py surveys/MT_Morocco_Atlas_Mountains/survey.yaml \
#       surveys/MT_Morocco_Atlas_Mountains/campaign_lineC2.yaml --dry-run
#
# Outputs go to <workspace>/campaign/lineC2/.
#
# PLAN FEATURES THE RUNNER DOES NOT HAVE YET (do not launch before they land,
# one commit each, after the line B campaign has finished):
#   1. `remotes:` per-site override of the stage 3 remote (C19 -> C22).
#   2. `windows:` per-site, per-mode processing windows and a merged product
#      (C05: yx from the short window, xy from the full record).
#   3. `modes:` per-site list of modes worth scoring/keeping (xy-only sites).
#   4. the `mantle` stage 3 config: `--engine mantle --mantle-max-hours 72`
#      (engine_mantle.MAX_HOURS becomes a CLI override) with its own
#      expected_peak_gb; MANTLE refuses masks, so its jobs run --no-masks.
#   5. mask scope: a masks.yaml entry applies only when its site is the
#      local (or is channel-scoped); today process_rr unions local+remote.
#   6. stage 2 stacks for every group (the machinery exists; group A only ran).
name: lineC2
description: >
  Line C round 2: every site rr every concurrent site with aurora (default),
  leave-one-out magnetic stacks for every group, then on each site's best
  remote the masked, MANTLE full-window and per-site-window products.
  Decisions from the 25 Sep diagnoses: C05 yx from 27 Sep 05:10-09:16 UTC
  only (ey channel fault before that), C19's remote is C22 (C21new has a
  wiring fault), C21new and C18 are xy-only sites, C13/C16/C19 carry Ben's
  new masks, C01's masks are dropped.

sites: [C01, C02, C03, C04, C05, C06, C07, C08, C09, C10, C11, C12, C13, C14, C15,
        C16, C17, C18, C19, C20, C21new, C22, C23]

exclude:
  C21: >-
    its raw folder is a byte-for-byte copy of C07's; C21new is the real C21

groups:
  A: [C18, C19, C20, C21new, C22, C23]        # 22-24 Sep
  B: [C12, C13, C14, C15, C16, C17]           # 23-25 Sep
  C10_C11: [C10, C11]                         # 24-26/27 Sep
  C: [C01, C02, C03, C04, C05, C06, C07, C08, C09]   # 25-27 Sep

overlap:
  min_fraction: 0.5
  min_hours: 12

# per-site decisions (features 1-3 above)
remotes:
  C19: C22          # the campaign's pick C21new has an ey wiring fault; C22 gives the same curve
modes:
  C18: [xy]         # ey is a channel fault outside its bursts (317x ex, coherence <= 0.03)
  C21new: [xy]      # the recorded E pair is nearly rank 1; only the x row is recoverable
  C05: [xy, yx]     # yx only from the short window below
windows:
  C05:
    yx: ["2023-09-27T05:10:00Z", "2023-09-27T09:16:49Z"]   # ey recovered at ~05:00 UTC; the raw record ends 09:16:49
    merge: true     # one product: xy from the full-record run, yx from this window

stages:
  variants: {}
  remotes: {}                      # stage 1: aurora defaults (Hann), tag lineC2-default
  stacks:                          # stage 2, all groups this time
    weightings: {u: none, w: coherence}
  options:                         # stage 3, on the best stage 1 remote (or the override)
    tie_tolerance: 0.02
    configs:
      masked: [--masks]                                   # masks.yaml with as-local scope (feature 5)
      mantle: [--engine, mantle, --mantle-max-hours, "72", --no-masks]   # feature 4
      pd8: [--per-decade, "8"]                            # the one option that beat the default at C01 in round 1

scoring:
  pmin: 0.005
  pmax: 5000

runner:
  minutes_per_job: {rr: 8, variant: 2, stack: 1, mantle: 12}
  min_available_gb: 40
  peak_factor: 1.0
  expected_peak_gb: {rr: 35, variant: 24, stack: 8, mantle: 65}   # MANTLE: 31.8 GB at 23.5 h, ~60 GB at 42 h
  peak_recent: 30
  move_products: false
  masks: false                     # stage 1 unmasked; the masked config is stage 3
