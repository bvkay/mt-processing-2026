# Campaign plan for scripts/campaign.py: line B of the Morocco Atlas survey.
#
#   python scripts/campaign.py surveys/MT_Morocco_Atlas_Mountains/survey.yaml \
#       surveys/MT_Morocco_Atlas_Mountains/campaign_lineB.yaml --dry-run
#
# Outputs go to <workspace>/campaign/lineB/ (ledger.csv, runs.log, scores.csv,
# figures/, tf/, summary.md); `--report` rebuilds the figures and summary.
name: lineB
description: >
  Line B: every site rr every concurrent site on the filtered variants
  (filters.yaml), then on each site's best remote the same run without the
  filters, with the masks the line noise profile proposed (masks.yaml, B01
  to B08, hours where max(step_ey, shift_ey) exceeds 0.05), and with a
  Hamming taper. Of the R remotes north of the line only R01 overlaps line
  B (B01 and B02 in February); R02, R03 and R04 overlap no line B site, R06
  (September) overlaps line C, and R05 holds no data (a full card).
  B12, B22 and B23 have no raw folder. There are no lemimt reference EDIs.

# every site along the line; R01 first (north of B01)
sites: [R01, B01, B02, B03, B04, B05, B06, B07, B08, B09, B10, B11, B13, B14, B15,
        B16, B17, B18, B19, B20, B21, B24, B25, B26, B27, B28, B29]

exclude:
  B30: >-
    its archive is a copy of B28's (the same two runs, 12 Mar 12:30 to
    14 Mar 09:30, the same size); the raw folders hold the same files
  B31: >-
    its archive is a copy of B29's (the same two runs, 12 Mar 11:08 to
    14 Mar 08:52, the same size); the raw folders hold the same files

# deployments (UTC), processed in this order; remotes are chosen from every
# listed site by overlap, the groups only order the work and bound the stacks
groups:
  Feb: [R01, B01, B02]                         # 13-18 Feb 2023
  Mar_a: [B28, B29]                            # 12-14 Mar
  Mar_b: [B27, B24, B25, B26]                  # 13-16 Mar (B27 from 13 Mar, the others from 14 Mar)
  Jul: [B05, B06, B07, B03, B04, B08, B09, B10, B14, B15, B16, B17, B18, B11, B13, B19, B20, B21]   # 17-28 Jul

# a remote is any listed site whose record overlaps the local's by at least
# min_fraction of the local record, or at least min_hours
overlap:
  min_fraction: 0.5
  min_hours: 12

stages:
  variants: {}     # stage 0: build each site's filtered variant (mtproc.ingest); raw archives are never touched
  remotes: {}      # stage 1: estimator defaults (Hann), tag lineB-default
  stacks:          # stage 2: not run (launched with --stage 0,1,3, as line C was after group A)
    weightings: {u: none, w: coherence}
  options:         # stage 3: on each site's best stage 1 remote; one --tag per config
    tie_tolerance: 0.02
    configs:
      nofilters: [--no-filters]     # the raw archives: what the declared filters change
      masked: [--masks]             # masks.yaml on both sites: what the proposed hour masks change
      hamming: [--taper, hamming]

# the period window every product is scored over (mtproc.quality)
scoring:
  pmin: 0.005
  pmax: 5000

runner:
  minutes_per_job: {rr: 8, variant: 1, stack: 1}   # --dry-run estimate only
  min_available_gb: 40      # a job starts only with this much memory free ...
  peak_factor: 1.0          # ... and 1.0 x the largest peak RSS the ledger has seen
  expected_peak_gb: {rr: 35, variant: 20, stack: 8}   # held back for running jobs until measured
  peak_recent: 30           # ... judged over the 30 most recent jobs
  move_products: false      # EDI/PNG/JSON stay in the survey's tf/ so the GUI lists them
  masks: false              # rr runs pass --no-masks; the masked config turns them on for its own runs
