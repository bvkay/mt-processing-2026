name: curnamona_cube
instrument: lemi423
sample_rate: 1000
data_root: E:/MT_Timeseries_DATA/MT_Curnamona_Cube_MT
# local time of the field area (IANA name), for display only: every
# timestamp in the YAML, the archives and the scripts is UTC
timezone: Australia/Adelaide
defaults:
  dipole_length_ex: 50.0
  dipole_length_ey: 50.0
  azimuth_ex: 0.0
  azimuth_ey: 90.0
  calibration_fn: sensors/l120n.rsp
  # empirical magnetics correction vs lemimt convention: pT -> nT + polarity
  # (validated on D02/E08: constant 1e6 rho offset, exact 180 deg phase)
  h_scale: -1000.0
  # no hz sensor was attached on any broadband deployment (Ben, 2026-09-22):
  # the B423 Bz column is an open input, so it is dropped at ingest
  channels: [ex, ey, hx, hy]
# lemimt-style even log-period band layout (see bbmt.bands.lemimt_band_scheme)
processing:
  min_period: 0.005
  max_period: 5000.0
  periods_per_decade: 10.0
  # keep bands clear of mains and its first in-range harmonic
  notch_frequencies: [50.0, 150.0]
generated_by: scripts/site_table_to_yaml.py
